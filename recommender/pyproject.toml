[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "feelm-recommender"
version = "0.1.0"
description = "Evidence-bounded internal recommendation core for FEELM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.140.7",
  "numpy==1.26.4",
  "pydantic==2.11.3",
  "starlette==1.6.0",
  "uvicorn==0.34.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]
training = ["scikit-learn==1.9.0"]

[project.scripts]
feelm-recommender = "feelm_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
