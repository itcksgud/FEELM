    purpose:
      - MovieLens의 외국 영화 편향과 데이터 수록 이후 영화의 상호작용 공백을 TMDB 구조 특징과 E5 콘텐츠 벡터로 보완할 수 있는지 비교한다.
      - 실제 추천 후 시청·평가 피드백을 수집할 수 없는 단계에서 MovieLens를 모델 학습·평가·검증 환경으로 사용하되, 서로 다른 사용자·미래 구간의 K5/K10 우열은 결정하지 않는다.
    decision_questions:
      - 같은 사용자·같은 미래 구간 prefix ablation 전 K=5와 K=10에 대해 어디까지 말할 수 있는가
      - 인기도, ItemKNN, 관측 BPR, TMDB 구조·텍스트, LightFM, RRF 중 어느 모델이 기준선보다 나은가
      - 사용자 이력량, 입력 영화 인기도, 영화 인기도, 콘텐츠 정보 유무에 따라 어느 점수와 fallback을 우선할 것인가
      - MovieLens를 특정 시점 cutoff로 제한한 결과와 전체 관측 범위의 보조 결과를 어떻게 구분할 것인가
