schema_version: 1
project: FEELM-standalone
contract_slice: C4A-EMAIL-MEMBERSHIP-ONBOARDING
status: APPROVED_LOCAL_PROFILE_WITH_BLOCKED_PRODUCTION_EXTENSIONS
rules:
  local_profile_implementation_authorized: true
  production_activation_forbidden: true
  production_email_oauth_restart_lifecycle_forbidden: true
  required_decision_ids:
    - DN-C4A-001
    - DN-C4A-002
    - DN-C4A-003
    - DN-C4A-004
    - DN-C4A-005
  social_production_adapter_blocked: true
  main_openapi_local_profile_merged: true
  common_registry_update_forbidden: true
  status_semantics:
    DONE_LOCAL_PROFILE_DECISIONS: conservative local-profile tokens are fixed; this is not production activation
    DONE_LOCAL_PROFILE_CONTRACT: the 13 authorized local operations are merged into main OpenAPI
    READY_LOCAL_PROFILE: local-only implementation may start
    READY_LOCAL_PROFILE_NEGATIVE_ONLY: only fail-closed absence/reservation tests may start; external capability remains blocked
    BLOCKED: a local predecessor is incomplete
    BLOCKED_PRODUCTION_PROMOTION: production activation needs separate authority
  local_operation_ids:
    - createEmailSignup
    - verifySignupEmail
    - resendSignupEmailVerification
    - loginWithEmail
    - refreshAuthentication
    - logoutCurrentSession
    - getMyMembership
    - updateMyNickname
    - listOnboardingMovies
    - replaceOnboardingPreferences
    - completeOnboarding
    - getMyOttSubscriptions
    - replaceMyOttSubscriptions
  blocked_operation_ids: [restartOnboarding]
  local_screen_ids: [SCR-C4A-001, SCR-C4A-002, SCR-C4A-003, SCR-C4A-004, SCR-C4A-005, SCR-C4A-006, SCR-C4A-007]
  acceptance_universe: AC-C4A-001..085
  blocked_acceptance_ids: [AC-C4A-034, AC-C4A-045, AC-C4A-067]
  production_negative_acceptance_ids: [AC-C4A-007, AC-C4A-061, AC-C4A-073, AC-C4A-081, AC-C4A-082]
  local_entity_ids:
    - USER_ACCOUNT
    - EMAIL_CREDENTIAL
    - USER_PROFILE
    - EMAIL_SIGNUP_PUBLIC_FLOW
    - EMAIL_VERIFICATION_CHALLENGE
    - VERIFICATION_DELIVERY_MATERIAL
    - PUBLIC_AUTH_IDEMPOTENCY_RECORD
    - PUBLIC_AUTH_IDEMPOTENCY_SCOPE_ALIAS
    - PUBLIC_AUTH_IDEMPOTENCY_REQUEST_HMAC_ALIAS
    - PENDING_SIGNUP_RECOVERY_ATTEMPT
    - AUTH_SESSION
    - AUTH_REFRESH_TOKEN
    - ONBOARDING_JOURNEY
    - ONBOARDING_PREFERENCE
    - OTT_SUBSCRIPTION_SET
    - USER_OTT_SUBSCRIPTION
    - MOVIE_IDENTITY
    - OTT_PROVIDER
    - IDEMPOTENCY_RECORD
    - DOMAIN_OUTBOX
  blocked_entity_ids: [SOCIAL_PROVIDER_CAPABILITY, SOCIAL_IDENTITY, SOCIAL_LINK_TRANSACTION]

