        '503': {$ref: '#/components/responses/ServiceUnavailable'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: DN-C4A-001 proposed; 현재 C1 required bearer 호환안
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-feelm_refresh
      description: Secure, HttpOnly, SameSite=Lax, Path=/, no Domain인 rotating opaque refresh 후보
    csrfCookie:
      type: apiKey
      in: cookie
      name: __Host-feelm_csrf
      description: >-
        Secure, SameSite=Lax, Path=/, no Domain. refresh generation/session에 서명·결합되며
        JavaScript가 같은 값을 X-CSRF-Token으로 제출한다.
    localRefreshCookie:
      type: apiKey
      in: cookie
      name: feelm_local_refresh
      description: loopback local HTTP 전용 non-Secure, HttpOnly, SameSite=Lax, Path=/, no Domain refresh cookie
    localCsrfCookie:
      type: apiKey
      in: cookie
      name: feelm_local_csrf
      description: loopback local HTTP 전용 non-Secure, JavaScript-readable, SameSite=Lax, Path=/, no Domain CSRF cookie

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[!-~]+$'
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: active-session logout mutation에는 사용; auth cookie가 모두 없는 204 clear retry에는 없어도 된다.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[!-~]+$'
    ExpectedRevision:
      name: X-Expected-Revision
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: login/refresh/logout은 server exact allowlist와 일치해야 하며 absent/null도 mutation 전에 거부한다.
      schema:
        type: string
        format: uri
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: 선택 profile의 CSRF cookie와 같고 refresh session/generation에 유효하게 서명된 값
      schema:
        type: string
        minLength: 32
        maxLength: 512
    OptionalCsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: auth cookie가 모두 없는 logout retry에서만 생략 가능; 하나라도 있으면 선택 profile의 signed cookie와 함께 필수다.
      schema: {type: string, minLength: 32, maxLength: 512}

  responses:
    ValidationError:
      description: 요청 값 오류
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: 인증 없음 또는 승인된 transport에서 token/session 무효
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ResourceNotFound:
      description: 존재하지 않거나 actor 소유가 아닌 resource
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: state, revision, unique 또는 idempotency 충돌
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ServiceUnavailable:
      description: DB 또는 필수 identity service를 안전하게 처리할 수 없음
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PublicSignupBadRequest:
      description: signup validation failure
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublicSignupBadRequestError'}
    PublicVerificationBadRequest:
      description: exact verification invalid or expired state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublicVerificationBadRequestError'}
    PublicResendBadRequest:
      description: exact resend invalid or expired state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublicResendBadRequestError'}
    LoginBadRequest:
      description: exact login request validation failure
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LoginBadRequestError'}
    PublicAuthConflict:
      description: exact public-auth idempotency or state conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublicAuthConflictError'}
    AuthFlowRateLimited:
      description: exact public-auth throttle or verification-attempt exhaustion
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthFlowRateLimitedError'}
    AuthThrottled:
      description: exact distributed auth throttle
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthThrottledError'}
    AuthDependencyUnavailable:
      description: public auth authority unavailable before mutation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthDependencyUnavailableError'}
    InvalidCredentials:
      description: unknown email or wrong password without enumeration detail
      content:
        application/json:
          schema: {$ref: '#/components/schemas/InvalidCredentialsError'}
    LoginForbidden:
      description: exact Origin failed or a correct pending credential cannot become a protected actor
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LoginForbiddenError'}
    AuthSessionInvalid:
      description: refresh family is unknown, expired, or revoked
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthSessionInvalidError'}
    AuthMutationForbidden:
      description: exact Origin or signed double-submit CSRF validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthMutationForbiddenError'}
    RefreshRaceConflict:
      description: immediately previous generation lost a concurrent refresh race
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RefreshRaceConflictError'}
    IdempotencyConflict:
      description: active mutation idempotency key body conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdempotencyConflictError'}

  schemas:
    CreateEmailSignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, nickname]
      x-local-decision-authority: [DN-C4A-002, DN-C4A-003]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          description: DN-C4A-002 packet의 proposed single-factor password 15~128자
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          description: trim+NFKC+casefold와 Letter/Number/underscore 전역 unique proposed

    PendingEmailSignup:
      type: object
      additionalProperties: false
      required: [signupId, membershipStatus, emailMasked, deliveryStatus, verificationExpiresAt, resendAvailableAt, revision]
      properties:
        signupId: {type: string, format: uuid}
        membershipStatus:
          type: string
          const: PENDING_EMAIL_VERIFICATION
        emailMasked: {type: string}
        deliveryStatus:
          type: string
          const: QUEUED
          description: 실제 delivery/account 존재 상태를 노출하지 않는 public generic 값
        verificationExpiresAt:
          type: string
          format: date-time
          description: actual 또는 persisted decoy signup handle 모두 response 기준 now+10m 후보
        resendAvailableAt:
          type: string
          format: date-time
          description: actual 또는 persisted decoy signup handle 모두 response 기준 now+60s 후보
        revision: {type: integer, const: 1}

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [signupId, verificationSecret]
      properties:
        signupId: {type: string, format: uuid}
        verificationSecret:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: >-
            request Host/Forwarded/X-Forwarded-Host가 아니라 pinned server config의 exact HTTPS frontend
            origin fragment로만 전달한다. frontend가 즉시 읽고 history.replaceState로 제거한 뒤 이 POST
            body에만 전송한다. raw 저장·로그·응답 금지.

    ResendEmailVerificationRequest:
      type: object
      additionalProperties: false
      required: [signupId]
      properties:
        signupId: {type: string, format: uuid}

    VerificationDeliveryState:
      type: object
      additionalProperties: false
      required: [signupId, deliveryStatus, verificationExpiresAt, resendAvailableAt, revision]
      properties:
        signupId:
          type: string
          format: uuid
          description: request handle echo; actual/decoy 여부를 나타내지 않음
        deliveryStatus:
          type: string
          const: QUEUED
        verificationExpiresAt: {type: string, format: date-time}
        resendAvailableAt: {type: string, format: date-time}
        revision: {type: integer, minimum: 2, description: stable signupId public-flow revision}

    EmailVerificationResult:
      type: object
      additionalProperties: false
      required: [membershipStatus, emailMasked, nextAction, revision]
      properties:
        membershipStatus: {type: string, const: ACTIVE}
        emailMasked: {type: string}
        nextAction: {type: string, const: LOGIN}
        revision: {type: integer, minimum: 1}

    EmailLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          writeOnly: true

    AuthenticationResult:
      type: object
      additionalProperties: false
      required: [tokenType, accessToken, expiresInSeconds, membership]
      x-local-decision-authority: [DN-C4A-001]
      properties:
        tokenType: {type: string, const: Bearer}
        accessToken:
          type: string
          readOnly: true
          description: response 전달만 허용; 저장·로그·fixture 금지
        expiresInSeconds:
          type: integer
          minimum: 1
          description: local access JWT TTL은 600초
        membership: {$ref: '#/components/schemas/MyMembership'}

    MyMembership:
      type: object
      additionalProperties: false
      required: [membershipStatus, emailMasked, nickname, profileRevision, onboarding]
      properties:
        membershipStatus:
          type: string
          enum: [PENDING_EMAIL_VERIFICATION, ACTIVE]
        emailMasked: {type: string}
        nickname: {type: string}
        profileRevision: {type: integer, minimum: 1}
        onboarding: {$ref: '#/components/schemas/OnboardingSummary'}

    UpdateNicknameRequest:
      type: object
      additionalProperties: false
      required: [nickname]
      x-local-decision-authority: [DN-C4A-002]
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 20

    OnboardingMoviePage:
      type: object
      additionalProperties: false
      required: [catalogVersion, selectionPolicyVersion, targetCount, items]
      properties:
        catalogVersion: {type: string}
        selectionPolicyVersion:
          type: string
          description: local 보수 baseline의 versioned policy identifier
        targetCount:
          type: integer
          minimum: 0
          description: 최대 10개이며 K10은 권장 목표일 뿐 minimum이 아님
        items:
          type: array
          maxItems: 10
          x-unique-by: movieId
          items: {$ref: '#/components/schemas/OnboardingMovie'}

    OnboardingMovie:
      type: object
      additionalProperties: false
      required: [movieId, title, posterUrl]
      properties:
        movieId: {type: string, format: uuid}
        title: {type: string}
        posterUrl: {type: [string, 'null'], format: uri}

    ReplaceOnboardingPreferencesRequest:
      type: object
      additionalProperties: false
      required: [catalogVersion, selectionPolicyVersion, preferences]
      properties:
        catalogVersion: {type: string}
        selectionPolicyVersion: {type: string}
        preferences:
          type: array
          maxItems: 10
          uniqueItems: true
          x-unique-by: movieId
          items: {$ref: '#/components/schemas/OnboardingPreferenceInput'}

    OnboardingPreferenceInput:
      type: object
      additionalProperties: false
      required: [movieId, preference]
      properties:
        movieId: {type: string, format: uuid}
        preference:
          type: string
          enum: [LIKE, DISLIKE]

    CompleteOnboardingRequest:
      type: object
      additionalProperties: false
      required: [completionMode, expectedPreferenceCount]
      properties:
        completionMode:
          type: string
          enum: [SUBMITTED, SKIPPED]
        expectedPreferenceCount:
          type: integer
          minimum: 0
          description: locked current active preference count와 반드시 같아야 하며 client 값만 신뢰하지 않는다.
      allOf:
        - if:
            properties: {completionMode: {const: SKIPPED}}
            required: [completionMode]
          then:
            properties: {expectedPreferenceCount: {const: 0}}
        - if:
            properties: {completionMode: {const: SUBMITTED}}
            required: [completionMode]
          then:
            properties:
              expectedPreferenceCount: {type: integer, minimum: 1, maximum: 10}

    OnboardingState:
      type: object
      additionalProperties: false
      required: [status, preferenceCount, likeCount, dislikeCount, revision, recommendationProjection]
      properties:
        status:
          type: string
          enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, SKIPPED]
        preferenceCount: {type: integer, minimum: 0, maximum: 10}
        likeCount: {type: integer, minimum: 0, maximum: 10}
        dislikeCount: {type: integer, minimum: 0, maximum: 10}
        requiredPreferenceCount:
          type: [integer, 'null']
          minimum: 0
          description: DN-C4A-004 승인 뒤 SUBMITTED minimum
        maximumPreferenceCount:
          type: [integer, 'null']
          minimum: 0
        revision: {type: integer, minimum: 1}
        recommendationProjection:
          type: string
          enum: [NOT_REQUESTED, PENDING, READY, FAILED]
          description: journey completion과 별도이며 READY도 순위 개선 주장이 아님
      x-count-invariant: preferenceCount = likeCount + dislikeCount = locked active preference row count
      allOf:
        - if:
            properties: {status: {enum: [NOT_STARTED, SKIPPED]}}
            required: [status]
          then:
            properties:
              preferenceCount: {const: 0}
              likeCount: {const: 0}
              dislikeCount: {const: 0}
        - if:
            properties: {status: {const: COMPLETED}}
            required: [status]
          then:
            properties:
              preferenceCount: {type: integer, minimum: 1, maximum: 10}

    OnboardingSummary:
      type: object
      additionalProperties: false
      required: [status, preferenceCount, revision]
      properties:
        status:
          type: string
          enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, SKIPPED]
        preferenceCount: {type: integer, minimum: 0, maximum: 10}
        revision: {type: integer, minimum: 1}
      allOf:
        - if:
            properties: {status: {enum: [NOT_STARTED, SKIPPED]}}
            required: [status]
          then:
            properties: {preferenceCount: {const: 0}}
        - if:
            properties: {status: {const: COMPLETED}}
            required: [status]
          then:
            properties: {preferenceCount: {type: integer, minimum: 1, maximum: 10}}

    ReplaceOttSubscriptionsRequest:
      type: object
      additionalProperties: false
      required: [selectionMode, providerIds]
      properties:
        selectionMode:
          type: string
          enum: [CONFIGURED, SKIPPED]
        providerIds:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
          description: SKIPPED면 empty, CONFIGURED면 empty도 명시적 no-subscription
      allOf:
        - if:
            properties: {selectionMode: {const: SKIPPED}}
            required: [selectionMode]
          then:
            properties: {providerIds: {type: array, maxItems: 0}}

    MyOttSubscriptionSet:
      type: object
      additionalProperties: false
      required: [region, selectionStatus, providerIds, revision]
      properties:
        region: {type: string, const: KR}
        selectionStatus:
          type: string
          enum: [NOT_CONFIGURED, CONFIGURED, SKIPPED]
        providerIds:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
      allOf:
        - if:
            properties:
              selectionStatus: {enum: [NOT_CONFIGURED, SKIPPED]}
            required: [selectionStatus]
          then:
            properties: {providerIds: {type: array, maxItems: 0}}

    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: {type: string}
        reason: {type: string}

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, traceId, fieldErrors]
      properties:
        code: {type: string}
        message: {type: string}
        traceId: {type: string}
        fieldErrors:
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
        currentRevision:
          type: [integer, 'null']
          minimum: 1
    PublicSignupBadRequestError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties: {code: {type: string, const: VALIDATION_ERROR}}
    PublicVerificationBadRequestError:
      allOf:
