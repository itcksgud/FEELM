openapi: 3.1.0
info:
  title: FEELM C4A Local Email Membership and Onboarding API
  version: 0.2.0-c4a-local
  summary: local 이메일 membership, LIKE/DISLIKE onboarding, KR OTT subscription 계약
  description: |
    APPROVED_LOCAL_PROFILE_WITH_BLOCKED_PRODUCTION_EXTENSIONS. 보수 token은 local profile에만
    채택됐다. main OpenAPI, production email, OAuth, restart, password/account lifecycle은 차단한다.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Membership
    description: 이메일 signup·verification·pending membership
  - name: Authentication
    description: local profile에 승인된 login·refresh·logout boundary
  - name: Onboarding
    description: Rating과 분리된 LIKE/DISLIKE journey·skip
  - name: MyProfile
    description: 본인 nickname·membership 요약
  - name: MyOttSubscriptions
    description: C0 KR provider를 참조하는 본인 subscription set
x-contract-status: APPROVED_LOCAL_PROFILE_WITH_BLOCKED_PRODUCTION_EXTENSIONS
x-main-openapi-merged: true
x-local-profile-implementation-status: AUTHORIZED_13_OPERATIONS
x-production-activation-status: BLOCKED
x-auth-cookie-csrf-reservation:
  status: AUTHORIZED_LOCAL_PROFILE
  decisionRequired: DN-C4A-001
  refreshCookie: __Host-feelm_refresh
  csrfCookie: __Host-feelm_csrf
  csrfHeader: X-CSRF-Token
  mutationProtection: exact Origin allowlist plus session-bound signed double-submit
  rotation: refresh and CSRF values rotate together after each successful refresh
  cookieProfiles:
    productionHttps:
      refresh: {name: __Host-feelm_refresh, secure: true, httpOnly: true, sameSite: Lax, path: /, domain: null}
      csrf: {name: __Host-feelm_csrf, secure: true, httpOnly: false, sameSite: Lax, path: /, domain: null}
    localHttpLoopbackOnly:
      refresh: {name: feelm_local_refresh, secure: false, httpOnly: true, sameSite: Lax, path: /, domain: null}
      csrf: {name: feelm_local_csrf, secure: false, httpOnly: false, sameSite: Lax, path: /, domain: null}
    clearAdds: {maxAge: 0, expires: 'Thu, 01 Jan 1970 00:00:00 GMT'}
    mixedProfileCookies: forbidden
x-email-verification-security:
  status: AUTHORIZED_LOCAL_PROFILE
  decisionRequired: DN-C4A-003
  frontendOriginSource: pinned versioned server configuration only
  requestHostHeadersTrusted: false
  ignoredRequestHeaders: [Host, Forwarded, X-Forwarded-Host]
  linkTransport: exact HTTPS frontend origin plus fragment, then POST body
  invalidOriginBehavior: dispatch and readiness fail closed
  returnedHandleState: stable EMAIL_SIGNUP_PUBLIC_FLOW actual or decoy row for 24 hours without extension
  challengeModel: REAL flow current_challenge_id references versioned EMAIL_VERIFICATION_CHALLENGE; DECOY has no challenge
  pendingRecovery: before created_at plus 30 days, same-password re-signup creates a new REAL flow after prior flow expiry
  pendingPurge: created_at plus 30 days; re-signup does not extend; verification race is atomic
x-verification-delivery-boundary:
  status: AUTHORIZED_LOCAL_PROFILE
  decisionRequired: DN-C4A-003
  model: encrypted single-use delivery material referenced by a safe outbox
  challengePersistence: SHA-256 hash only; raw verification secret is never a database, outbox, log, trace, or HTTP target value
  encryption: AES-256-GCM envelope encryption with ciphertext, nonce, and delivery_key_version in VERIFICATION_DELIVERY_MATERIAL
  keySource: versioned secret store; missing or unknown versions fail readiness and dispatch closed
  keyRetention: a decrypt key version cannot retire while any unexpired material references it
  outboxPayload: materialId and challenge pseudonym only; no raw secret, ciphertext, nonce, email, or link
  dispatch: worker lease after DB commit; resolve recipient by challenge owner join, decrypt only in memory, and construct the pinned-origin fragment link
  recipientSecretScope: raw recipient and link are forbidden in database, outbox, cache, log, trace, metric, and test artifact; they may exist only transiently in worker memory and the TLS provider request wire
  providerObservability: redact request and response body, headers, recipient, link, and adapter exception details
  deletion: remove ciphertext and nonce on provider acceptance or challenge terminal, superseded, or expired; never later than challenge expiry
  crashWindows:
    beforeProviderAcceptance: lease expiry retries the same material and same challenge
    afterProviderAcceptanceBeforeDelete: at-least-once duplicate of the same single-use link is allowed; no new secret or challenge
    afterChallengeConsumed: duplicate delivery is harmless because the challenge hash consumes exactly once
x-access-jwt-boundary:
  status: AUTHORIZED_LOCAL_PROFILE
  decisionRequired: DN-C4A-001
  algorithmAllowlist: [RS256]
  requiredHeaders: [alg, kid, typ]
  requiredClaims: [iss, aud, sub, sid, jti, iat, nbf, exp]
  issuer: exact versioned FEELM issuer configuration
  audience: exact FEELM resource-server audience
  leewaySeconds: 30
  maxLifetime: 10m
  subjectFormat: UUID
  forbiddenClaims: [email, nickname, password, refreshToken]
  keyRotation: versioned public-key registry accepts current and previous key for at most 48h overlap
  failure: unknown or missing kid, disallowed alg, bad iss or aud, invalid time, malformed UUID, missing or stale registry returns 401; non-test resource-server readiness fails closed
x-cookie-response-boundary:
  repeatedHeader: Set-Cookie
  headerCount: 2
  commaFolding: forbidden
  profiles: [productionHttps, localHttpLoopbackOnly]
x-auth-idempotency-boundary:
  order: canonical validation and scope, PostgreSQL lookup/replay-or-409, Redis admission on miss, domain transaction with result
  activeActorLedger: C1 IDEMPOTENCY_RECORD keyed by actor user
  publicAuthLedger: C4A canonical PUBLIC_AUTH_IDEMPOTENCY_RECORD plus scope and request-HMAC alias tables; never place anonymous identity or signupId in actor_user_id
  publicScope:
    createSignup: PRE_SIGNUP_IDENTITY current and previous HMAC projections
    verifyAndResend: SIGNUP_FLOW canonical stable signup UUID
  canonicalRecordPrimaryKey: [record_id]
  scopeAliasUnique: [scope_kind, scope_value, operation_code, idempotency_key]
  aliasWrite: on miss insert every accepted current and previous identity projection alias to the same canonical record in one transaction so old and new deployments observe the same winner
  requestDigestAlias: PUBLIC_AUTH_IDEMPOTENCY_REQUEST_HMAC_ALIAS stores every accepted current and previous keyed canonical-body HMAC for the canonical record so old and new deployments can verify equality
  lock: sorted PostgreSQL transaction advisory locks for every accepted current and previous derived scope plus operation and key
  requestEquality: constant-time comparison against current or previous HMAC-SHA-256 digest aliases of the canonical body
  forbiddenRequestDigest: unkeyed hash of a body containing password or verificationSecret
  keyRetention: identity-scope and request-HMAC keys cannot retire while a live public record references them
  atomicity: public record, REAL or DECOY flow or transition, recovery attempt, safe response, audit, and outbox commit or roll back together
  redisFailureResultsPersisted: false
  retention:
    signupAndResendWrongVerify: through public flow expiry; flow cleanup deletes nonterminal records together
    verifySuccess: terminal result plus 24h independent of flow cleanup
    activeLogout: revoked session terminal result plus 24h
  replay: does not consume Redis counters, attempts, cooldowns, mail, or audit; raw tokens are never persisted
  terminalReplay: verify success remains terminal plus 24h independent of public-flow foreign-key cleanup
  cookieLessLogout: no idempotency record
x-pending-signup-recovery-linearization:
  observation: only a request that initially sees an expired prior REAL flow creates an attempt
  attempt: PENDING_SIGNUP_RECOVERY_ATTEMPT with PostgreSQL admitted_at and prior_expired_signup_id before account lock
  winner: account-lock revalidation creates a flow linked by recovery_attempt_id and recovery_from_signup_id and marks WON
  concurrentLoser: admitted before winner linearization and blocked on the same account may link LOST_REPLAY only to a winner for the same prior flow
  laterRequest: a request that initially sees the new OPEN REAL flow creates no recovery attempt and follows DECOY
  atomicity: attempt status, winner or replay response, public idempotency record, and flow changes commit together
x-auth-rate-limit-authority:
  status: AUTHORIZED_LOCAL_PROFILE
  decisionRequired: DN-C4A-003
  decisionDependencies: [DN-C4A-001, DN-C4A-003]
  store: shared Redis
  clock: Redis server UTC TIME
  operation: atomic counter plus TTL via Lua or Redis Function
  localFallback: forbidden
  unavailableBehavior: 503 before identity, challenge, or session mutation
  policies:
    globalEmergency:
      policy: versioned capacity-derived integer limit required at approval
      missingConfiguration: non-test readiness fails closed
    sharedMail:
      operations: [createEmailSignup, resendSignupEmailVerification]
      identity: [{limit: 5, window: 1h}, {limit: 10, window: 1d}]
      coarseIp: [{limit: 20, window: 1h}, {limit: 100, window: 1d}]
      actualAndDecoy: consume on idempotency miss
    verify:
      coarseIp: [{limit: 30, window: 1h}]
    login:
      identityFailures: {threshold: 5, window: 15m, delay: exponential-30s-to-15m}
      coarseIp: {limit: 50, window: 15m, throttle: 15m}
    refresh:
      sessionFamily: {limit: 30, window: 1m}
      coarseIp: {limit: 120, window: 15m}
  networkProjection:
    trustedProxy: only the immediate peer in configured trusted-proxy CIDRs may supply one canonical configured Forwarded or X-Forwarded-For chain
    untrustedPeer: socket peer IP only; forwarded headers ignored
    malformedOrAmbiguous: reject before rate admission
    coarseIp: {ipv4Prefix: 24, ipv6Prefix: 56}
    keyedProjection: HMAC with explicit key version
    rotationAggregation: one Redis Function atomically sums current and previous counters for the same logical window, rejects on the aggregate limit, and increments only current on allow
    retirement: previous remains until the maximum quota window and pre-signup idempotency retention both drain; no third active version before drain
    keyFailure: missing or unknown key version fails non-test readiness closed
x-password-hashing-boundary:
  status: AUTHORIZED_LOCAL_PROFILE
  decisionRequired: DN-C4A-002
  algorithm: Argon2id
  hardFloor: 'm=19456 KiB,t=2,p=1'
  performanceTarget: 'p95<=500ms'
  conflictBehavior: keep security floor and fail non-test auth readiness/startup
  dummyVerification: same production algorithm, version, memory, time, and parallelism parameters for unknown login and decoy signup
  calibration: current hash, dummy hash, and every supported stored PHC verify workload
  publicTiming: commonFloor=max(p99 supported workloads)+25ms plus 0..75ms CSPRNG server jitter
  calibrationFailure: missing, stale, unsupported PHC, or commonFloor violation fails non-test readiness closed
x-refresh-lineage-boundary:
  status: AUTHORIZED_LOCAL_PROFILE
  decisionRequired: DN-C4A-001
  raceClock: PostgreSQL primary clock_timestamp under row lock
  raceGrace: 5s
  retention: family terminal timestamp plus 30 days
  cleanup: delete family token hashes and AUTH_SESSION together
x-social-linking-reservation:
  status: BLOCKED
  decisionRequired: DN-C4A-005
  publicOperations: []
  identityKey: [provider, issuer, subjectHmac]
  transactionBinding: [authenticatedUser, authenticationSession, provider, expectedIssuer, exactRedirectUri]
  proof: [stateHash, encryptedPkceVerifier, pkceS256Challenge, nonceHash]
  mixUpDefense: server-side provider and issuer allowlist; callback cannot choose token endpoint or issuer
  emailClaimAutoMerge: false
x-blocked-capabilities:
  - id: SOCIAL_GOOGLE
    decisionRequired: DN-C4A-005
    status: BLOCKED
  - id: SOCIAL_KAKAO
    decisionRequired: DN-C4A-005
    status: BLOCKED
  - id: SOCIAL_NAVER
    decisionRequired: DN-C4A-005
    status: BLOCKED
  - id: ONBOARDING_RESTART
    decisionRequired: DN-C4A-004
    status: BLOCKED
  - id: PRODUCTION_EMAIL
    decisionRequired: DN-C4A-003
    status: BLOCKED
  - id: PASSWORD_ACCOUNT_LIFECYCLE
    decisionRequired: DN-C4A-001
    status: BLOCKED

paths:
  /api/v1/auth/sign-up:
    post:
      tags: [Membership]
      operationId: createEmailSignup
      x-implementation-status: AUTHORIZED_LOCAL_CONTRACT
      summary: 이메일·비밀번호·nickname으로 pending membership 생성
      security: []
      x-local-decision-authority: [DN-C4A-002, DN-C4A-003]
      x-enumeration-response-policy:
        status: AUTHORIZED_LOCAL_PROFILE
        actualHandle: persistent opaque UUID for the new REAL public flow, distinct from every challenge ID
        duplicateOrUnknownHandle: persistent decoy opaque UUID with no account, secret, or mail
        returnedHandleRetentionHours: 24
        followUpState: same persisted cooldown, attempts, expiry, and revision for actual and decoy
        publicShape: masked email, QUEUED, response-time plus 10-minute expiry, response-time plus 60-second resend, revision 1
        responseFloor: calibrated commonFloor=max(p99 supported PHC workloads)+25ms
        responseJitterMilliseconds: {minimum: 0, maximum: 75}
        duplicateWork: dummy Argon2id plus queue-equivalent work
        stableHandleEntity: EMAIL_SIGNUP_PUBLIC_FLOW
        currentChallenge: versioned internal current_challenge_id for REAL only
        flowExpires: createdAt plus 24 hours without resend extension
        pendingRecovery: only after prior REAL flow is EXPIRED and before pendingPurgeAt; preserve nickname and OTT set
        pendingPurge: account createdAt plus 30 days without re-signup extension
        exactPublicCodes:
          malformed: {status: 400, code: VALIDATION_ERROR}
          idempotencyConflict: {status: 409, code: IDEMPOTENCY_KEY_REUSED}
          stateConflict: {status: 409, code: AUTH_STATE_CONFLICT}
          throttled: {status: 429, code: AUTH_FLOW_THROTTLED}
          dependency: {status: 503, code: AUTH_DEPENDENCY_UNAVAILABLE}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmailSignupRequest'
      responses:
        '202':
          description: >-
            존재 여부와 무관하게 같은 shape인 generic pending 상태. signupId와 expiry/resend 시각은
            신규 account에는 actual challenge handle이고 duplicate/unknown에는 persisted decoy handle이다.
            raw verification secret을 포함하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingEmailSignup'
        '400': {$ref: '#/components/responses/PublicSignupBadRequest'}
        '409': {$ref: '#/components/responses/PublicAuthConflict'}
        '429': {$ref: '#/components/responses/AuthThrottled'}
        '503': {$ref: '#/components/responses/AuthDependencyUnavailable'}

  /api/v1/auth/email-verifications:
    post:
      tags: [Membership]
      operationId: verifySignupEmail
      x-implementation-status: AUTHORIZED_LOCAL_CONTRACT
      summary: email verification challenge 소비와 membership 활성화
      security: []
      x-local-decision-authority: [DN-C4A-003]
      x-generic-handle-policy:
        persistence: returned actual and decoy rows exist for 24 hours
        decoyBehavior: every submitted secret follows the wrong-attempt transition
        concurrency: row lock gives verify or resend exactly one transition winner
        unknownHandle: generic invalid-or-expired response without account detail
        exactPublicCodes:
          malformed: {status: 400, code: VALIDATION_ERROR}
          wrong: {status: 400, code: VERIFICATION_INVALID}
          unknownTerminalOrExpired: {status: 400, code: SIGNUP_FLOW_INVALID_OR_EXPIRED}
          attemptsExhausted: {status: 429, code: VERIFICATION_ATTEMPTS_EXHAUSTED}
          throttled: {status: 429, code: AUTH_FLOW_THROTTLED}
          idempotencyConflict: {status: 409, code: IDEMPOTENCY_KEY_REUSED}
          stateConflict: {status: 409, code: AUTH_STATE_CONFLICT}
          dependency: {status: 503, code: AUTH_DEPENDENCY_UNAVAILABLE}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: membership ACTIVE. 자동 login/token 발급 없이 login 화면으로 진행한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResult'
        '400': {$ref: '#/components/responses/PublicVerificationBadRequest'}
        '409': {$ref: '#/components/responses/PublicAuthConflict'}
        '429': {$ref: '#/components/responses/AuthFlowRateLimited'}
        '503': {$ref: '#/components/responses/AuthDependencyUnavailable'}

  /api/v1/auth/email-verification-resends:
    post:
      tags: [Membership]
      operationId: resendSignupEmailVerification
      x-implementation-status: AUTHORIZED_LOCAL_CONTRACT
      summary: pending signup email verification 재전송 요청
      security: []
      x-local-decision-authority: [DN-C4A-003]
      x-generic-handle-policy:
        persistence: returned actual and decoy rows exist for 24 hours
        decoyBehavior: update the same cooldown, attempt, expiry, and revision state without mail
        concurrency: row lock gives verify or resend exactly one transition winner
        unknownHandle: generic invalid-or-expired response without account detail
        stableSignupId: unchanged; REAL current_challenge_id/version and flow revision advance
        exactPublicCodes:
          accepted: {status: 202}
          invalidOrExpired: {status: 400, code: SIGNUP_FLOW_INVALID_OR_EXPIRED}
          throttled: {status: 429, code: AUTH_FLOW_THROTTLED}
          idempotencyConflict: {status: 409, code: IDEMPOTENCY_KEY_REUSED}
          stateConflict: {status: 409, code: AUTH_STATE_CONFLICT}
          dependency: {status: 503, code: AUTH_DEPENDENCY_UNAVAILABLE}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
      responses:
        '202':
          description: 열거를 줄이는 generic delivery state. raw secret 없음.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationDeliveryState'
        '400': {$ref: '#/components/responses/PublicResendBadRequest'}
        '409': {$ref: '#/components/responses/PublicAuthConflict'}
        '429': {$ref: '#/components/responses/AuthThrottled'}
        '503': {$ref: '#/components/responses/AuthDependencyUnavailable'}

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: loginWithEmail
      x-implementation-status: AUTHORIZED_LOCAL_CONTRACT
      summary: ACTIVE email membership 로그인
      security: []
      x-local-decision-authority: [DN-C4A-001, DN-C4A-003]
      x-enumeration-timing-policy:
        exactPublicCodes:
          malformed: {status: 400, code: VALIDATION_ERROR}
          invalidCredentials: {status: 401, code: INVALID_CREDENTIALS}
          originFailure: {status: 403, code: AUTH_ORIGIN_FORBIDDEN}
          pendingAfterCorrectPassword: {status: 403, code: EMAIL_VERIFICATION_REQUIRED}
          throttled: {status: 429, code: AUTH_FLOW_THROTTLED}
          dependency: {status: 503, code: AUTH_DEPENDENCY_UNAVAILABLE}
        originFailure: {status: 403, code: AUTH_ORIGIN_FORBIDDEN, beforeCredentialWork: true}
        unknownEmail: verify fixed dummy PHC hash with current production Argon2id parameters
        wrongPassword: verify stored PHC hash
        commonFailure: {status: 401, code: INVALID_CREDENTIALS, timing: 'calibrated commonFloor=max(p99 supported PHC workloads)+25ms plus CSPRNG 0..75ms jitter'}
        pendingAfterCorrectPassword: {status: 403, code: EMAIL_VERIFICATION_REQUIRED}
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLoginRequest'
      responses:
        '200':
          description: DN-C4A-001의 proposed access bearer와 선택 cookie profile의 refresh/CSRF cookie 발급
          x-set-cookie-contract:
            repeatedHeader: Set-Cookie
            count: 2
            commaFolding: forbidden
            action: issue
            profiles: [productionHttps, localHttpLoopbackOnly]
          headers:
            Set-Cookie:
              description: >-
                production HTTPS profile은 __Host-feelm_refresh (Secure, HttpOnly, SameSite=Lax, Path=/)와
                JavaScript-readable __Host-feelm_csrf (Secure, SameSite=Lax, Path=/)를 발급한다.
                loopback local HTTP profile은 feelm_local_refresh (non-Secure, HttpOnly, SameSite=Lax, Path=/)와
                JavaScript-readable feelm_local_csrf (non-Secure, SameSite=Lax, Path=/)를 발급한다.
                선택 profile의 두 header를 각각 전송하며 Domain은 없고 profile을 섞지 않는다.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResult'
        '400': {$ref: '#/components/responses/LoginBadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/LoginForbidden'}
        '429': {$ref: '#/components/responses/AuthThrottled'}
        '503': {$ref: '#/components/responses/AuthDependencyUnavailable'}

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAuthentication
      x-implementation-status: AUTHORIZED_LOCAL_CONTRACT
      summary: proposed refresh rotation으로 access bearer 갱신
      security:
        - refreshCookie: []
          csrfCookie: []
        - localRefreshCookie: []
          localCsrfCookie: []
      x-local-decision-authority: [DN-C4A-001]
      x-race-clock: PostgreSQL primary clock_timestamp under session and token row lock
      x-cookie-profile-auth: exactly one complete production or local pair; mixed or partial pairs are forbidden
      x-exact-errors:
        invalidSession: {status: 401, code: AUTH_SESSION_INVALID}
        origin: {status: 403, code: AUTH_ORIGIN_FORBIDDEN}
        csrf: {status: 403, code: CSRF_FORBIDDEN}
        race: {status: 409, code: REFRESH_RACE_RETRY_NEW_COOKIE}
        throttled: {status: 429, code: AUTH_FLOW_THROTTLED}
        dependency: {status: 503, code: AUTH_DEPENDENCY_UNAVAILABLE}
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: 회전된 refresh cookie와 새 access bearer
          x-set-cookie-contract:
            repeatedHeader: Set-Cookie
            count: 2
            commaFolding: forbidden
            action: rotate
            profiles: [productionHttps, localHttpLoopbackOnly]
          headers:
            Set-Cookie:
              description: >-
                새 refresh와 새 signed CSRF cookie를 별도 Set-Cookie header로 함께 회전한다.
                이전 CSRF header/cookie pair는 새 refresh generation에 사용할 수 없다.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResult'
        '401': {$ref: '#/components/responses/AuthSessionInvalid'}
        '403': {$ref: '#/components/responses/AuthMutationForbidden'}
        '409': {$ref: '#/components/responses/RefreshRaceConflict'}
        '429': {$ref: '#/components/responses/AuthThrottled'}
        '503': {$ref: '#/components/responses/AuthDependencyUnavailable'}

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutCurrentSession
      x-implementation-status: AUTHORIZED_LOCAL_CONTRACT
      summary: refresh cookie가 가리키는 current authentication session 폐기
      security:
        - refreshCookie: []
          csrfCookie: []
        - localRefreshCookie: []
          localCsrfCookie: []
        - {}
      x-local-decision-authority: [DN-C4A-001]
      x-logout-retry-policy:
        origin: exact allowed Origin is mandatory for every branch, including cookie-less retry
        bothAuthCookiesAbsent: 204 with both exact clear headers; no CSRF, idempotency, DB, or audit mutation required
        partialPair: 403 CSRF_FORBIDDEN
        completePairInvalidSession: valid Origin and CSRF but unknown, expired, or revoked refresh returns 401 AUTH_SESSION_INVALID
        successfulReplay: same idempotency key replays 204 and exact clear without another audit mutation
        clearAttributes: selected profile issuance attributes plus Max-Age=0 and epoch Expires
        exactErrors:
          origin: {status: 403, code: AUTH_ORIGIN_FORBIDDEN}
          csrfOrPartialPair: {status: 403, code: CSRF_FORBIDDEN}
          invalidSession: {status: 401, code: AUTH_SESSION_INVALID}
          idempotencyConflict: {status: 409, code: IDEMPOTENCY_KEY_REUSED}
          dependency: {status: 503, code: AUTH_DEPENDENCY_UNAVAILABLE}
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/OptionalCsrfTokenHeader'
      responses:
        '204':
          description: >-
            current refresh family를 즉시 revoke하고 refresh/CSRF cookie를 제거한다. 이미 발급된
            access JWT는 server-side denylist가 없는 v1 후보에서 최대 10분 exp까지 유효할 수 있다.
          x-set-cookie-contract:
            repeatedHeader: Set-Cookie
            count: 2
            commaFolding: forbidden
            action: clear
            profiles: [productionHttps, localHttpLoopbackOnly]
          headers:
            Set-Cookie:
              description: >-
                선택 profile의 refresh/CSRF name, Path=/, no Domain, SameSite=Lax, Secure/HttpOnly를 발급과
                동일하게 유지하고 Max-Age=0, Expires=Thu, 01 Jan 1970 00:00:00 GMT를 더한 두 header.
              schema: {type: string}
        '401': {$ref: '#/components/responses/AuthSessionInvalid'}
