    run_id: EXP-20260829-005
    evidence: docs/recommendation/evidence/REC-EV-005-party-policy.md
    artifact: outputs/recommendation-evidence/rec-ev-005/party_policy_metrics.parquet
    validation_eval:
      validation_parties: 270
      selected_floor: 0.5
      selected_floor_weight: 0.5
      selected_gap_weight: 0.25
      test_parties: 270
      balanced_delta_mean_utility: -0.001349
      balanced_delta_mean_ci95: [-0.003739, 0.000659]
      balanced_delta_min_utility: 0.000538
      balanced_delta_min_ci95: [-0.003494, 0.004453]
      balanced_delta_member_gap: -0.004249
      balanced_delta_gap_ci95: [-0.011559, 0.002376]
      four_member_common_rated_test_coverage: [0.006948, 0.010204]
    decision: DO_NOT_ADOPT_PRODUCT_POLICY
    reason: Balanced의 세 paired CI가 모두 0을 포함하고 4인 공통평가 coverage가 약 1%라 개선·일반화 근거가 없으며 실제 파티 만족도도 관측하지 않았다.

  - version: c6-discrete-quantized-midrank-ecdf-v2
