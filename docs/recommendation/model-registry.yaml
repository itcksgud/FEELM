    reason: 전체 미래 상태를 예측하지만 cold-start·다중 seed·Test gate 전에는 champion으로 승격하지 않는다.

  - version: als-r32-reg010-i10-s42-exp-20260829-001
    status: EXPERIMENTAL_NOT_ADOPTED
