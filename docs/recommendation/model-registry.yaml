    run_id: EXP-20260829-001
    evidence: docs/recommendation/evidence/REC-EV-002-prediction-calibration.md
    artifact: outputs/recommendation-evidence/rec-ev-002/als_factors.npz
    validation_eval:
      direct_coverage: 0.117374
      warm_isotonic_mae: 0.6268
      warm_isotonic_ece_decile: 0.020354
      sampled_ndcg_at_10: 0.259481
      sampled_popularity_ndcg_at_10: 0.472726
    decision: DO_NOT_ADOPT_YET
    reason: warm 예상 별점은 개선했지만 coverage가 낮고 sampled ranking에서 Popularity를 이기지 못했다.

  - version: cold-foldin-standalone-exp-20260829-002
    status: REJECTED_FOR_RANKING
    purpose: cold_start_rating_prediction_and_ranking
    run_id: EXP-20260829-002
    evidence: docs/recommendation/evidence/REC-EV-003-cold-start.md
    artifact: outputs/recommendation-evidence/rec-ev-003/foldin_user_factors.npz
    validation_eval:
      cohort_users: 3014
      k10_macro_mae: 0.731145
      k20_macro_mae: 0.713993
      k0_sampled_ndcg_at_10: 0.461799
      k20_sampled_ndcg_at_10: 0.221903
    decision: REJECT_AS_STANDALONE_RANK_SCORE
    reason: K10·K20 별점 오차는 개선했지만 모든 K에서 Popularity ranking을 크게 하회했다.

  - version: cold-dual-head-blend-exp-20260829-003
    status: VALIDATED_CANDIDATE_NOT_CHAMPION
    purpose: cold_start_star_only_with_popularity_ranking
    run_id: EXP-20260829-003
    evidence: docs/recommendation/evidence/REC-EV-003B-cold-start-blend.md
    artifact: outputs/recommendation-evidence/rec-ev-003b/selected_star_predictions.parquet
    validation_eval:
      first_statistical_k: 1
      first_practical_k: 10
      k10_star_alpha: 0.3
      k10_macro_mae: 0.725313
      k10_relative_improvement: 0.039513
      k20_star_alpha: 0.4
      ranking_alpha_all_k: 0.0
    decision: USE_K10_ONLY_AS_UI_COMPARISON_CANDIDATE
    reason: 별점 head는 실질 개선 Gate를 통과했지만 순위 head는 모든 K에서 Popularity 유지가 최적이었다.

  - version: party-balanced-offline-exp-20260829-005
    status: VALIDATED_OFFLINE_COMPARISON_NOT_ADOPTED
