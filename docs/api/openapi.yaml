components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    localActor:
      type: apiKey
      in: header
      name: X-Local-Actor-Id
      description: loopback local fixture allowlist UUID only; production authentication이 아님
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-feelm_refresh
    csrfCookie:
      type: apiKey
      in: cookie
      name: __Host-feelm_csrf
    localRefreshCookie:
      type: apiKey
      in: cookie
      name: feelm_local_refresh
    localCsrfCookie:
      type: apiKey
      in: cookie
      name: feelm_local_csrf
    localBearer:
      type: http
      scheme: bearer
      bearerFormat: LocalAccessToken
    reportViewerSession:
      type: apiKey
      in: header
      name: X-Report-Viewer-Session
  parameters:
    MovieId:
      name: movieId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: 같은 API operation·query·revision 조건에만 재사용 가능한 opaque cursor
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[!-~]+$
    ExpectedRevision:
      name: X-Expected-Revision
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
    WatchIntentId:
      name: watchIntentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FrameId:
      name: frameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryItemId:
      name: deliveryItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    C2BIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    C3ComparisonId:
      name: comparisonId
      in: path
      required: true
      schema: { type: string, format: uuid }
    C3PartyId:
      name: partyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    C3InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    C3ProviderIdQuery:
      name: providerId
      in: query
      required: true
      schema: { type: string, format: uuid }
    C3Cursor:
      name: cursor
      in: query
      required: false
      description: actor/resource/materialization/sort key에 결합된 opaque local cursor
      schema: { type: string, minLength: 1, maxLength: 2048 }
    C3Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  headers:
    CatalogVersion:
      description: 응답을 생성한 Catalog read model version
      schema:
        type: string
  responses:
    ValidationError:
      description: 요청 값 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: VALIDATION_ERROR
            message: 요청 값을 확인해 주세요.
            traceId: 01J6H0M5Z4A40B5Y9M7A04M6R8
            fieldErrors:
              - field: releaseYearFrom
                reason: must_be_less_than_or_equal_to_releaseYearTo
    InvalidAccessToken:
      description: 선택적으로 전달된 token이 유효하지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INVALID_ACCESS_TOKEN
            message: 인증 정보를 확인해 주세요.
            traceId: 01J6H0M5Z4A40B5Y9M7A04M6R8
            fieldErrors: []
    MovieNotFound:
      description: 존재하지 않거나 공개할 수 없는 영화
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: MOVIE_NOT_FOUND
            message: 영화 정보를 찾을 수 없어요.
            traceId: 01J6H0M5Z4A40B5Y9M7A04M6R8
            fieldErrors: []
    CatalogUnavailable:
      description: 로컬 Catalog read model을 조회할 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: CATALOG_UNAVAILABLE
            message: 영화 정보를 불러올 수 없어요. 잠시 후 다시 시도해 주세요.
            traceId: 01J6H0M5Z4A40B5Y9M7A04M6R8
            fieldErrors: []
    Unauthorized:
      description: 인증 정보 또는 local actor가 없거나 유효하지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResourceNotFound:
      description: 존재하지 않거나 actor 소유가 아닌 resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: revision, 상태, idempotency 충돌
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: C1 DB transaction을 안전하게 처리할 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    C3ProviderIdSet:
      type: array
      minItems: 2
      maxItems: 4
      uniqueItems: true
      items: { type: string, format: uuid }
    C3CreateOttCatalogComparisonRequest:
      type: object
      additionalProperties: false
      required: [providerIds]
      properties:
        providerIds: { $ref: "#/components/schemas/C3ProviderIdSet" }
    C3OttCatalogComparison:
      type: object
      additionalProperties: false
      required: [comparisonId, status, region, monetizationType, catalogVersion, providers]
      properties:
        comparisonId: { type: string, format: uuid }
        status: { type: string, const: READY }
        region: { type: string, const: KR }
        monetizationType: { type: string, const: FLATRATE }
        catalogVersion: { type: string, minLength: 1 }
        providers:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: "#/components/schemas/C3ProviderCatalogSummary" }
    C3ProviderCatalogSummary:
      type: object
      additionalProperties: false
      required: [provider, movieCount, moviesHref]
      properties:
        provider: { $ref: "#/components/schemas/ProviderSummary" }
        movieCount: { type: integer, minimum: 0 }
        moviesHref: { type: string, format: uri-reference }
    C3CatalogMovie:
      type: object
      additionalProperties: false
      required: [movie, availableProviderIds]
      properties:
        movie: { $ref: "#/components/schemas/MovieSummary" }
        availableProviderIds:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { type: string, format: uuid }
    C3CatalogMoviePage:
      type: object
      additionalProperties: false
      required: [comparisonId, providerId, totalCount, hasNext, nextCursor, items]
      properties:
        comparisonId: { type: string, format: uuid }
        providerId: { type: string, format: uuid }
        totalCount: { type: integer, minimum: 0 }
        hasNext: { type: boolean }
        nextCursor: { type: [string, "null"] }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/C3CatalogMovie" }
      allOf:
        - if:
            properties: { hasNext: { const: true } }
