        excludedCount: { type: integer, minimum: 0, maximum: 500 }
    RecommendationAppend:
      type: object
      additionalProperties: false
      required: [appendEventId, deliveryId, deliveryRevision, outcome, selectionSummary, appendedItems, issues, pageInfo, replayed]
      properties:
        appendEventId: { type: string, format: uuid }
        deliveryId: { type: string, format: uuid }
        deliveryRevision: { type: integer, minimum: 1 }
        outcome: { type: string, enum: [COMPLETE, PARTIAL, EMPTY] }
        selectionSummary: { $ref: "#/components/schemas/SelectionSummary" }
        appendedItems:
          type: array
          minItems: 0
          maxItems: 3
          items: { $ref: "#/components/schemas/PersonalDiscoveryDeliveryItem" }
        issues:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/PersonalDiscoverySafeIssue" }
        pageInfo: { $ref: "#/components/schemas/RecommendationPageInfo" }
        replayed: { type: boolean }
      allOf:
        - if: { properties: { outcome: { const: COMPLETE } }, required: [outcome] }
          then: { properties: { appendedItems: { type: array, minItems: 3, maxItems: 3 } } }
        - if: { properties: { outcome: { const: PARTIAL } }, required: [outcome] }
          then: { properties: { appendedItems: { type: array, minItems: 1, maxItems: 2 } } }
        - if: { properties: { outcome: { const: EMPTY } }, required: [outcome] }
          then: { properties: { appendedItems: { type: array, maxItems: 0 } } }
