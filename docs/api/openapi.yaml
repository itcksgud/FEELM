          enum:
            - CREATED
            - ACTIVE_REUSED
            - ALREADY_WATCHED
        movieId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
          description: 이번 실제 클릭 destination의 provider. ACTIVE_REUSED intent의 최초 provider와 다를 수 있다.
        watchIntent:
          description: ALREADY_WATCHED면 null, 그 외에는 새로 생성되거나 재사용된 active intent
          oneOf:
            - $ref: "#/components/schemas/WatchIntentSnapshot"
            - type: "null"
        destination:
          $ref: "#/components/schemas/ExternalDestination"
    WatchIntentSnapshot:
      type: object
      additionalProperties: false
      required:
        - watchIntentId
        - status
        - clickedAt
        - confirmationDueAt
        - expiresAt
        - revision
      properties:
        watchIntentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - LINK_CLICKED
            - CONFIRMATION_PENDING
        clickedAt:
          type: string
          format: date-time
        confirmationDueAt:
          type: string
          format: date-time
          description: 최초 active clickedAt + 48시간
        expiresAt:
          type: string
          format: date-time
          description: 최초 active clickedAt + 7일
        revision:
          type: integer
          minimum: 1
    ExternalDestination:
      type: object
      additionalProperties: false
      required:
        - linkType
        - url
        - externalNavigation
      properties:
        linkType:
          type: string
          enum:
            - AGGREGATOR
            - DIRECT
        url:
          type: string
          format: uri
        externalNavigation:
          type: boolean
          const: true
    ConfirmWatchIntentRequest:
      type: object
      additionalProperties: false
      required:
        - watched
        - expectedRevision
      properties:
        watched:
          type: boolean
        expectedRevision:
          type: integer
          minimum: 1
    WatchConfirmationResult:
      type: object
      additionalProperties: false
      required:
        - watchIntentId
        - status
        - respondedAt
        - revision
        - viewingRecord
      properties:
        watchIntentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - CONFIRMED_WATCHED
            - CONFIRMED_NOT_WATCHED
        respondedAt:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 2
        viewingRecord:
          oneOf:
            - $ref: "#/components/schemas/ViewingRecordSummary"
            - type: "null"
    MovieSummary:
      type: object
      additionalProperties: false
