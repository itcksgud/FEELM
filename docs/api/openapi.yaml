openapi: 3.1.0
info:
  title: FEELM Catalog, Rating, Discovery, Membership and Local Report API
  version: 0.6.0-c5-local
  summary: C0~C4 계약과 C5 local factual report·public resource·share·notification 계약
  description: |
    FEELM standalone의 C0 Catalog와 C1 Rating·Film 승인 계약에 로컬 개발용 C2B
    비개인화 인기 baseline 세로 기능을 더한 계약이다. C2B의 production activation,
    개인화, XAI, 예상 별점, exposure/action 수집은 승인되지 않았다.
    C0 조회 인증은 기존처럼 선택 사항이며 C1 및 C2B operation은 bearer 인증이 필수다.
    C3는 loopback 개발에서만 tracked allowlist fake actor header를 사용한다. production 인증,
    개인화, 예상 별점, 만족도 추정은 승인되지 않았다.
    C4는 local email signup·Mailpit verification·로그인과 membership·onboarding만 승인한다.
    production email, social login, password/account lifecycle, onboarding restart는 차단 상태다.
    C5는 factual half-year report, PRIVATE-default public resource, loopback report share,
    providerless in-app notification의 local MVP만 승인하며 production/external capability는 차단한다.
servers:
  - url: http://localhost:8080
    description: Local Spring API
tags:
  - name: Movies
    description: 공개 영화 검색, 상세, 유사 영화, OTT 시청 옵션
  - name: CatalogFacets
    description: 검색 필터에 사용하는 Catalog 기준 정보
  - name: OttProviders
    description: 한국 지역 OTT provider 기준 정보
  - name: Viewing
    description: OTT 클릭, 감상 확인, 지연 평가 대상
  - name: Ratings
    description: 내 정수 1~5 Rating 생성·수정·삭제와 조회
  - name: Film
    description: Rating에서 파생된 내 Frame과 Film
  - name: Taste
    description: Popcorn Bucket과 취향 원천 집계
  - name: PersonalDiscovery
    description: 로컬 개발에서만 승인된 비개인화 인기 baseline 추천 컬렉션
  - name: OttCatalogComparison
    description: local actor의 KR FLATRATE 실제 영화 전체 비교
  - name: Party
    description: owner 포함 최대 4명의 local-only Party
  - name: TasteReport
    description: immutable factual calendar-half reports
  - name: ReportExport
    description: local temporary PDF exports
  - name: Privacy
    description: PRIVATE-default resource visibility
  - name: PublicProfile
    description: exact opt-in public resource reads
  - name: ReportShare
    description: loopback fragment exchange report sharing
  - name: Notification
    description: providerless in-app notifications
  - name: PartyInvitation
    description: allowlist fake actor 초대와 수락
  - name: PartyBaseline
    description: 개인화·만족도 추정 없는 결정적 catalog baseline
  - name: Membership
    description: local 이메일 signup·verification membership
  - name: Authentication
    description: local login·refresh·logout session boundary
  - name: Onboarding
    description: Rating과 분리된 LIKE/DISLIKE onboarding
  - name: MyProfile
    description: 내 membership·nickname local profile
  - name: MyOttSubscriptions
    description: 내 KR OTT subscription 전체 교체
paths:
  /api/v1/movies:
    get:
      tags:
        - Movies
      operationId: searchMovies
      summary: 영화 검색·필터
      description: |
        제목·원제·감독·배우를 검색한다. 서로 다른 filter category는 AND,
        같은 category의 복수 값은 OR다. query가 있으면 기본 RELEVANCE,
        없으면 POPULARITY 순이다.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          description: trim 후 1~100자. 생략하거나 공백이면 query 없음으로 처리한다.
          schema:
            type: string
            maxLength: 100
          example: 나우 유 씨 미
        - name: genreIds
          in: query
          description: 같은 category 안 OR
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              format: uuid
        - name: countryCodes
          in: query
          description: ISO 3166-1 alpha-2. 같은 category 안 OR
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              pattern: ^[A-Z]{2}$
          example:
            - US
            - KR
        - name: releaseYearFrom
          in: query
          schema:
            type: integer
            minimum: 1870
            maximum: 2100
        - name: releaseYearTo
          in: query
          schema:
            type: integer
            minimum: 1870
            maximum: 2100
        - name: ottProviderIds
          in: query
          description: KR availability provider. 같은 category 안 OR
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              format: uuid
        - name: ottMonetizationTypes
          in: query
          description: 생략하면 FLATRATE만 적용
          style: form
          explode: true
          schema:
            type: array
            maxItems: 5
            default:
              - FLATRATE
            items:
              $ref: "#/components/schemas/MonetizationType"
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/MovieSort"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 검색 성공. 결과가 없어도 200이다.
          headers:
            X-Catalog-Version:
              $ref: "#/components/headers/CatalogVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieSearchPage"
              examples:
                result:
                  value:
                    catalogVersion: catalog-20260829-01
                    totalCount: 1
                    hasNext: false
                    nextCursor: null
                    items:
                      - movieId: 6b226903-0ca4-4f5a-9bf0-50d6cedd224c
                        displayTitle: 나우 유 씨 미
                        displayTitleLocale: ko-KR
                        releaseYear: 2013
                        posterUrl: https://image.tmdb.org/t/p/w500/example.jpg
                        genres:
                          - genreId: 2d07d5d3-486f-4638-9d58-49331e798c76
                            name: 범죄
                        externalRating:
                          source: TMDB
                          value: 7.3
                          scale: 10
                          ratingCount: 12800
                        availability:
                          region: KR
                          availabilityStatus: LISTED
                          freshness: FRESH
                          snapshotAt: 2026-08-29T08:00:00Z
                          flatrateProviders:
                            - providerId: d392a4d5-0428-4e06-aa41-aef899c06842
                              name: Netflix
                              logoUrl: https://image.tmdb.org/t/p/original/example-logo.jpg
                              isSubscribed: null
                    appliedFilters:
                      query: 나우 유 씨 미
                      genreIds: []
                      countryCodes: []
                      releaseYearFrom: null
                      releaseYearTo: null
                      ottProviderIds: []
                      ottMonetizationTypes:
                        - FLATRATE
                      sort: RELEVANCE
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidAccessToken"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/movies/{movieId}:
    get:
      tags:
        - Movies
      operationId: getMovie
      summary: 영화 상세 조회
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MovieId"
      responses:
        "200":
          description: Catalog-visible 영화 상세
          headers:
            X-Catalog-Version:
              $ref: "#/components/headers/CatalogVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidAccessToken"
        "404":
          $ref: "#/components/responses/MovieNotFound"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/movies/{movieId}/similar:
    get:
      tags:
        - Movies
      operationId: getSimilarMovies
      summary: 유사 영화 조회
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MovieId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 10
      responses:
        "200":
          description: 같은 similarityVersion의 결정적 목록
          headers:
            X-Catalog-Version:
              $ref: "#/components/headers/CatalogVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarMovieResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidAccessToken"
        "404":
          $ref: "#/components/responses/MovieNotFound"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/movies/{movieId}/ott-offers:
    get:
      tags:
        - Movies
      operationId: getMovieOttOffers
      summary: 한국 OTT 시청 옵션 조회
      description: 구독형·구매·대여·무료·광고형을 별도 그룹으로 반환한다.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MovieId"
      responses:
        "200":
          description: 데이터 미등록과 상태 미확인을 body 상태로 구분한다.
          headers:
            X-Catalog-Version:
              $ref: "#/components/headers/CatalogVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OttAvailability"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidAccessToken"
        "404":
          $ref: "#/components/responses/MovieNotFound"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/catalog/genres:
    get:
      tags:
        - CatalogFacets
      operationId: listGenres
      summary: 검색 가능한 장르 목록
      security:
        - {}
      responses:
        "200":
          description: 표시 순서가 고정된 장르 목록
          headers:
            X-Catalog-Version:
              $ref: "#/components/headers/CatalogVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreListResponse"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/catalog/countries:
    get:
      tags:
        - CatalogFacets
      operationId: listCountries
      summary: 검색 가능한 제작 국가 목록
      security:
        - {}
      responses:
        "200":
          description: 영화가 하나 이상 연결된 국가 목록
          headers:
            X-Catalog-Version:
              $ref: "#/components/headers/CatalogVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryListResponse"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/ott-providers:
    get:
      tags:
        - OttProviders
      operationId: listOttProviders
      summary: KR 필터·설정용 OTT provider 목록
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: 현재 Catalog에서 사용 가능한 provider 기준 정보
          headers:
            X-Catalog-Version:
              $ref: "#/components/headers/CatalogVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OttProviderListResponse"
        "401":
          $ref: "#/components/responses/InvalidAccessToken"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/watch-intents:
    post:
      tags:
        - Viewing
      operationId: createWatchIntent
      summary: OTT 외부 이동 직전 클릭 사실 기록
      description: |
        새 intent면 CREATED, 같은 user/movie의 active intent가 있으면 시각을 갱신하지 않고
        ACTIVE_REUSED, ViewingRecord가 이미 있으면 intent를 만들지 않고 ALREADY_WATCHED를 반환한다.
        서로 다른 Idempotency-Key의 실제 클릭은 각 한 건의 OTT_LINK_CLICKED event를 기록한다.
      parameters:
        - $ref: "#/components/parameters/C2BIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWatchIntentRequest"
      responses:
        "200":
          description: active intent 재사용, 이미 감상한 영화, 또는 같은 key의 최초 응답 replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchIntentClickResult"
        "201":
          description: 새 WatchIntent 생성. destination을 받은 뒤 외부 이동한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchIntentClickResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerAuth: []
  /api/v1/me/watch-intents/pending-confirmation:
    get:
      tags:
        - Viewing
      operationId: listPendingWatchConfirmations
      summary: 감상 확인이 필요한 내 항목 조회
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 빈 목록도 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingWatchConfirmationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerAuth: []
  /api/v1/watch-intents/{watchIntentId}/confirmation:
    post:
      tags:
        - Viewing
      operationId: confirmWatchIntent
      summary: 실제 감상 여부 응답
      parameters:
        - $ref: "#/components/parameters/WatchIntentId"
        - $ref: "#/components/parameters/C2BIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmWatchIntentRequest"
      responses:
        "200":
          description: terminal 상태와 watched=true일 때 생성된 ViewingRecord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchConfirmationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerAuth: []
  /api/v1/me/viewing-records/unrated:
    get:
      tags:
        - Viewing
        - Ratings
      operationId: listUnratedViewingRecords
      summary: 감상 확인 후 평가하지 않은 영화 조회
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 빈 목록도 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnratedViewingRecordPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerAuth: []
  /api/v1/me/ratings:
    get:
      tags:
        - Ratings
      operationId: listMyRatings
      summary: 내 활성 Rating 목록
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 빈 목록도 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerAuth: []
  /api/v1/me/ratings/{movieId}:
    put:
      tags:
        - Ratings
      operationId: putMyRating
      summary: 정수 1~5 Rating 생성 또는 수정
      description: active projection의 visibilityStatus=UI_READY이고 active flavor mapping에 assignment가 정확히 하나인 영화만 허용한다.
      parameters:
        - $ref: "#/components/parameters/MovieId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutRatingRequest"
      responses:
        "200":
          description: create/update 또는 idempotent replay 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingMutationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerAuth: []
    delete:
      tags:
        - Ratings
      operationId: deleteMyRating
      summary: 내 Rating 삭제
      description: |
        Rating을 soft-delete하고 ViewingRecord를 WATCHED_CONFIRMED로 유지한다. Frame·Popcorn과
        contribution을 제거하고 Flavor/Taste aggregate를 역산하며 event·outbox를 같은 transaction에 기록한다.
      parameters:
        - $ref: "#/components/parameters/MovieId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedRevision"
      responses:
        "200":
          description: soft-delete와 파생 projection 제거·집계 역산이 원자적으로 완료됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingDeletionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerAuth: []
  /api/v1/me/film:
    get:
      tags:
        - Film
      operationId: getMyFilm
      summary: 내 전체 Film과 Frame 목록
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Frame가 없어도 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerAuth: []
  /api/v1/me/film/frames/{frameId}:
    get:
      tags:
        - Film
      operationId: getMyFrame
      summary: 내 Frame 상세
      parameters:
        - $ref: "#/components/parameters/FrameId"
      responses:
        "200":
          description: Frame 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerAuth: []
  /api/v1/me/popcorn-bucket:
    get:
      tags:
        - Taste
      operationId: getMyPopcornBucket
      summary: 내 Popcorn flavor별 수량·평균 Rating
      responses:
        "200":
          description: Popcorn이 없어도 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopcornBucket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerAuth: []
  /api/v1/me/taste-profile:
    get:
      tags:
        - Taste
      operationId: getMyTasteProfile
      summary: 확정 source dimension의 취향 원천 집계
      description: 최종 취향 점수와 키워드는 포함하지 않는다.
      responses:
        "200":
          description: aggregate가 없어도 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasteProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - bearerAuth: []
  /api/v1/me/recommendations/personal-discovery:
    get:
      tags: [PersonalDiscovery]
      operationId: getMyPersonalDiscoveryRecommendations
      x-implementation-status: AUTHORIZED_LOCAL_CONTRACT
      x-production-activation: false
      summary: 로컬 비개인화 인기 baseline 추천 컬렉션 조회
      description: 개인화, XAI 추천 사유, 예상 별점, exposure/action 의미를 포함하지 않는다.
      responses:
        "200":
          description: 최초 또는 기존 active 컬렉션
          headers:
            Cache-Control:
              description: directive 순서와 무관하게 private와 no-store를 모두 포함한다.
              schema: { type: string }
              example: "no-store, private"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
      security: [{ bearerAuth: [] }]
  /api/v1/me/recommendation-deliveries/{deliveryId}/append:
    post:
      tags: [PersonalDiscovery]
      operationId: appendMyPersonalDiscoveryRecommendations
