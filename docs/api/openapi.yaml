        - releaseYear
      properties:
        movieId:
          type: string
          format: uuid
        displayTitle:
          type: string
          minLength: 1
        posterUrl:
          type:
            - string
            - "null"
          format: uri
        releaseYear:
          type:
            - integer
            - "null"
          minimum: 1870
          maximum: 2100
    PendingWatchConfirmation:
