name: FEELM Research CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Lint GitHub Actions workflow with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/feelm-actionlint-1.7.12"
          mkdir -p "$tool_root"
          curl --fail --location --silent --show-error \
            --output "$tool_root/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_root/actionlint.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$tool_root/actionlint.tar.gz" --directory "$tool_root" actionlint
          "$tool_root/actionlint" -no-color .github/workflows/ci.yml
      - run: npm run revision:readiness:require
      - run: npm run verification:parity:check
      - run: npm run contracts:check
      - run: npm run c1:contracts:check
      - run: npm run c2:contracts:check
      - run: npm run c2b:contracts:check
      - run: npm run c2b:decisions:check
      - run: npm run c3:contracts:check
      - run: npm run c3:decisions:check
      - run: npm run c4:contracts:check
      - run: npm run c4:decisions:check
      - run: npm run c5:contracts:check
      - run: npm run c6:contracts:check
      - run: npm run approvals:check
      - run: npm run completion:gates:check
      - run: npm run completion:gates:mutation:check
      - run: npm run supply-chain:check
      - run: npm run security:secrets:check
      - run: npm run openapi:lint
      - run: npm run openapi:mock:check

  recommender:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.5'
          cache: pip
      - run: python -m pip install --require-hashes -r recommender/requirements-test.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ./recommender
      - run: python -m unittest discover -s recommender/tests -p 'test_*.py' -v

  recommendation-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.5'
          cache: pip
      - run: python -m pip install --require-hashes -r scripts/requirements-build-tools.lock
      - run: python -m pip install --no-build-isolation --require-hashes -r requirements-data.lock
      - run: python -m pip install --require-hashes -r requirements-ml.lock
      - run: npm run recommendation:evidence:tracked:check

  catalog-pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.5'
          cache: pip
      - run: python -m pip install --require-hashes -r scripts/requirements-build-tools.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ./data-pipeline
      - run: python -m unittest discover -s data-pipeline/tests -p 'test_*.py' -v
